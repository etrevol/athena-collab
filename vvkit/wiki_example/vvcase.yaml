version: 1
name: athena_scalar_diff_cyl_2d

solver:
  type: athena++
  template: athinput.scalar_diff.template
  plugin_args:
    # ${ATHENA_ROOT}, never a fixed checkout. athena_source puts the adapter into its
    # on-the-fly build mode: it runs configure.py and make IN THIS TREE. Pointed at the
    # main checkout it reconfigured it to scalar_diff and rebuilt bin/athena, while
    # .build_state went on naming acc_disk_visc with a matching source hash -- so the
    # next ./build.sh would have seen nothing to do and handed over a binary solving a
    # different problem. That is the exact trap CLAUDE.md documents, and this line
    # walked into it.
    athena_source: "${ATHENA_ROOT}"
    configure_args: ["--prob=scalar_diff", "--coord=cylindrical", "--nscalars=1"]
    use_wsl: true
    wsl_distro: Ubuntu
    fields:
      s0: u

mms:
  operator: "None"
  solution: "1.0e-6 / (4.0*pi*0.001*(0.5 + 0.5)) * exp( -( (x*cos(y) - 0.5)**2 + (x*sin(y) - 0.5)**2 ) / (4.0*0.001*(0.5 + 0.5)) )"
  symbols:
    pi: 3.141592653589793
  domain:
    x: [0.1, 1.0]
    y: [0.0, 6.283185307179586]

study:
  type: spatial
  coordinate_system: cylindrical
  refinement:
    parameter: nx
    values: [64, 128, 256]
  reference: cell_average
  quadrature_order: 5
  expected_order: 2.0
  order_tolerance: 0.3
  norms: [L1, L2]
  exclude_boundary_cells: 0

report:
  formats: [html, json]
  output_dir: reports/
