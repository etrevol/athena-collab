# M4 -- the shear stress T_rphi against its analytic profile.
#
# The ONLY study here that touches the azimuthal derivative:
#
#   T_rphi = rho * nu * [ r d(v_phi/r)/dr + (1/r) dv_r/dphi ]
#
# At two cycles v_r is still zero, so the measured quantity is the first term, computed
# by the generator with centred differences on the volume-centroid radii. The reference
# below is the same expression differentiated exactly, branch by branch across the torus
# surface (differentiating Max(f, 0) directly yields Heaviside and then DiracDelta, which
# will not lambdify).
#
# The expression was validated against the solver's own T_rphi column at 512^2 before
# this study was written: agreement is 1e-5 to 1e-3 relative across the whole domain,
# which is the discretisation error this study then measures the order of.
#
# In the ambient the analytic stress is a constant: nu ~ r^{3/2} and r dOmega/dr ~
# r^{-3/2} cancel, leaving -1.5 * coeff * p_atm * w * sqrt(beta).
#
# GENERATED by hand-checked SymPy; see notes/ for the derivation script.
